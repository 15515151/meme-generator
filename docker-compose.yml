services:
  meme-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: meme-generator:latest
    container_name: meme-generator
    restart: unless-stopped
    ports:
      - "2233:2233"
    volumes:
      # 配置、管理员凭据与同步的外部仓库都在这里，务必持久化
      - meme-data:/data
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: INFO
      # 访问私有仓库或在 GitHub 接口限流时提高配额（可选）
      # GITHUB_TOKEN: ghp_xxxxxxxxxxxx
      # GitHub 加速源，留空直连（可选，也可以稍后在管理面板里设置）
      # GITHUB_PROXY: https://ghfast.top/
      # 百度翻译（可选，部分表情需要）
      BAIDU_TRANS_APPID: ""
      BAIDU_TRANS_APIKEY: ""
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:2233/meme/version', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  meme-data:
