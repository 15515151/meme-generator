name: Test

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # skia（pil-utils 依赖）需要这些系统库，否则 import 就会失败
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig fonts-noto-color-emoji \
            libgl1 libglx-mesa0 libgl1-mesa-dri libegl1

      - name: Install fonts
        run: |
          sudo mkdir -p /usr/share/fonts/meme-fonts
          sudo cp resources/fonts/* /usr/share/fonts/meme-fonts/
          sudo fc-cache -fv

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run tests
        run: uv run --locked pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: web
        run: npx tsc -b

      - name: Build console
        working-directory: web
        run: npm run build
