[project]
name = "meme-generator"
version = "0.1.14"
description = "Python package for making fun pictures"
authors = [{ name = "meetwq", email = "meetwq@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "httpx>=0.20.0,<1.0.0",
    "loguru>=0.6.0,<1.0.0",
    # Keep Windows installs working on Python 3.9/3.10.
    "msvc-runtime<14.44; sys_platform == 'win32'",
    "pil-utils>=0.2.0,<0.3.0",
    "Pillow>=10.0.0,<11.0.0",
    "toml>=0.10.2,<0.11.0",
    "fastapi>=0.93.0,<1.0.0",
    "uvicorn>=0.20.0,<1.0.0",
    "python-multipart>=0.0.9,<0.1.0,!=0.0.13,!=0.0.14",
    "filetype>=1.2.0,<2.0.0",
    "rich>=13.0.0,<14.0.0",
    "dateparser>=1.2.0,<2.0.0",
    "qrcode>=8.0,<9.0",
    "typing-extensions>=4.4.0,<5.0.0",
    "arclet-alconna>=1.8.23,<2.0.0,!=1.8.27",
    "arclet-alconna-tools>=0.7.9,<0.8.0",
    "skia-python>=138.0",
]

[project.urls]
Homepage = "https://github.com/MemeCrafters/meme-generator"
Repository = "https://github.com/MemeCrafters/meme-generator"

[project.scripts]
meme = "meme_generator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff==0.11.7",
]

[tool.hatch.build]
exclude = [
    "meme_generator/memes/**/*.jpg",
    "meme_generator/memes/**/*.png",
    "meme_generator/memes/**/*.gif",
]

[tool.hatch.build.targets.wheel]
packages = ["meme_generator"]

[tool.pyright]
pythonVersion = "3.9"
pythonPlatform = "All"
typeCheckingMode = "basic"
defineConstant = { PYDANTIC_V2 = true }

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "PYI", "PT", "Q", "I"]
ignore = ["E402", "E501", "E711", "C901", "UP037"]

[tool.ruff.lint.isort]
detect-same-package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
